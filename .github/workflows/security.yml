name: Security & Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    name: Audit Ringan Toko Hana
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cek file wajib ada
        run: |
          for f in index.html App.jsx manifest.json vercel.json db/BENTENG_AKTIF_RESMI.md; do
            if [ ! -f "$f" ]; then echo "::error::File wajib hilang: $f"; exit 1; fi
          done
          echo "Semua file wajib ada ✅"

      - name: Pastikan TIDAK ada service_role key bocor
        run: |
          if grep -rn "service_role" index.html App.jsx manifest.json 2>/dev/null | grep -v "JANGAN"; then
            echo "::error::TERDETEKSI service_role di file publik! Cabut segera!"
            exit 1
          fi
          echo "Tidak ada kebocoran service_role ✅"

      - name: Pastikan SQL berbahaya tetap di karantina
        run: |
          if [ -f "db/SECURE_RLS_TOKO_HANA.sql" ]; then
            echo "::error::SQL audit OpenCode kembali ke db/! Harus tetap di _archive!"
            exit 1
          fi
          echo "SQL karantina aman di arsip ✅"

      - name: Validasi index.html utuh
        run: |
          if ! tail -c 100 index.html | grep -q "</html>"; then
            echo "::error::index.html tidak ditutup </html> — build korup?"
            exit 1
          fi
          echo "index.html utuh ✅"
